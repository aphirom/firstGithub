<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISE Prompt Library — ครูเทคโนโลยี ม.ปลาย (สพฐ.)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Prompt:wght@300;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --bg4: #202536;
    --border: #2a2f42;
    --text: #e8eaf0;
    --muted: #7a8099;
    --accent: #4f8ef7;

    --cat1: #4f8ef7;
    --cat2: #38c9a0;
    --cat3: #f4a135;
    --cat4: #e05c7a;

    --green: #22c55e;
    --green-dark: #16a34a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
  }

  .header-left h1 {
    font-family: 'Prompt', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--text);
    line-height: 1.2;
  }
  .header-left span {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .btn-download {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-family: 'Sarabun', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    transition: background .2s;
    flex-shrink: 0;
  }
  .btn-download:hover { background: var(--green-dark); }

  /* ─── CONTROLS ─── */
  .controls {
    padding: 18px 28px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 65px;
    z-index: 90;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
  }
  .search-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px 9px 38px;
    border-radius: 8px;
    font-family: 'Sarabun', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap .ico {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .filter-btn {
    border: 1.5px solid;
    background: transparent;
    padding: 6px 14px;
    border-radius: 20px;
    font-family: 'Sarabun', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  .filter-btn.all { border-color: var(--muted); color: var(--muted); }
  .filter-btn.all.active { background: var(--muted); color: #000; }

  .filter-btn.c1 { border-color: var(--cat1); color: var(--cat1); }
  .filter-btn.c1.active { background: var(--cat1); color: #fff; }
  .filter-btn.c2 { border-color: var(--cat2); color: var(--cat2); }
  .filter-btn.c2.active { background: var(--cat2); color: #000; }
  .filter-btn.c3 { border-color: var(--cat3); color: var(--cat3); }
  .filter-btn.c3.active { background: var(--cat3); color: #000; }
  .filter-btn.c4 { border-color: var(--cat4); color: var(--cat4); }
  .filter-btn.c4.active { background: var(--cat4); color: #fff; }

  /* ─── STATS ─── */
  .stats-bar {
    padding: 10px 28px;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid var(--border);
  }

  /* ─── GRID ─── */
  .grid {
    padding: 24px 28px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid;
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: transform .15s, background .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  .card:hover {
    background: var(--bg3);
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .card[data-cat="1"] { border-left-color: var(--cat1); }
  .card[data-cat="2"] { border-left-color: var(--cat2); }
  .card[data-cat="3"] { border-left-color: var(--cat3); }
  .card[data-cat="4"] { border-left-color: var(--cat4); }

  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    padding: 2px 8px;
    border-radius: 4px;
    width: fit-content;
    letter-spacing: .03em;
  }
  .card[data-cat="1"] .card-badge { background: rgba(79,142,247,.15); color: var(--cat1); }
  .card[data-cat="2"] .card-badge { background: rgba(56,201,160,.15); color: var(--cat2); }
  .card[data-cat="3"] .card-badge { background: rgba(244,161,53,.15); color: var(--cat3); }
  .card[data-cat="4"] .card-badge { background: rgba(224,92,122,.15); color: var(--cat4); }

  .card-title {
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.4;
    color: var(--text);
  }

  .card-desc {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-num {
    position: absolute;
    top: 12px;
    right: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--border);
  }

  /* ─── MODAL ─── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 720px;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
    transform: scale(.96);
    transition: transform .2s;
  }
  .overlay.open .modal { transform: scale(1); }

  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg2);
    z-index: 10;
  }
  .modal-header .modal-badge { margin-bottom: 8px; }
  .modal-header h2 {
    font-family: 'Prompt', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    line-height: 1.4;
  }

  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }

  .rise-block {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .rise-label {
    padding: 7px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: .08em;
    border-bottom: 1px solid var(--border);
  }
  .rise-block:nth-child(1) .rise-label { color: var(--cat1); background: rgba(79,142,247,.07); }
  .rise-block:nth-child(2) .rise-label { color: var(--cat2); background: rgba(56,201,160,.07); }
  .rise-block:nth-child(3) .rise-label { color: var(--cat3); background: rgba(244,161,53,.07); }
  .rise-block:nth-child(4) .rise-label { color: var(--cat4); background: rgba(224,92,122,.07); }

  .rise-content {
    padding: 12px 14px;
    font-size: 0.88rem;
    line-height: 1.75;
    color: #cdd0da;
    white-space: pre-wrap;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: flex-end;
  }

  .btn-close-modal {
    background: var(--bg4);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    font-size: 0.85rem;
    transition: background .15s;
  }
  .btn-close-modal:hover { background: var(--border); }

  .btn-copy {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 8px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .15s;
  }
  .btn-copy:hover { background: #3a7ce0; }
  .btn-copy.copied { background: var(--green); }

  .close-x {
    position: absolute;
    top: 16px; right: 18px;
    background: none; border: none;
    color: var(--muted); font-size: 1.2rem;
    cursor: pointer; line-height: 1;
    padding: 4px 8px;
    border-radius: 4px;
    transition: color .15s;
  }
  .close-x:hover { color: var(--text); }

  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>📚 RISE Prompt Library — ครูเทคโนโลยี ม.ปลาย</h1>
    <span>สังกัด สพฐ. · 90 prompts · 4 หมวด</span>
  </div>
  <button class="btn-download" onclick="downloadHTML()">⬇ Download HTML</button>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="ค้นหา prompt..." oninput="filterCards()">
  </div>
  <div class="filters">
    <button class="filter-btn all active" onclick="setFilter('all',this)">ทั้งหมด</button>
    <button class="filter-btn c1" onclick="setFilter('1',this)">📋 วิเคราะห์หลักสูตร/แผนสอน</button>
    <button class="filter-btn c2" onclick="setFilter('2',this)">🔬 วิจัยในชั้นเรียน</button>
    <button class="filter-btn c3" onclick="setFilter('3',this)">🎨 สื่อการสอนเทคโนโลยี</button>
    <button class="filter-btn c4" onclick="setFilter('4',this)">📝 แบบทดสอบ/แบบประเมิน</button>
  </div>
</div>

<div class="stats-bar" id="statsBar">แสดง 90 / 90 prompts</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <button class="close-x" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <div class="modal-badge" id="modalBadge"></div>
      <h2 id="modalTitle"></h2>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-close-modal" onclick="closeModal()">ปิด</button>
      <button class="btn-copy" id="copyBtn" onclick="copyPrompt()">📋 คัดลอก Prompt</button>
    </div>
  </div>
</div>

<script>
const CAT_NAMES = {
  "1": "📋 วิเคราะห์หลักสูตร/แผนสอน",
  "2": "🔬 วิจัยในชั้นเรียน",
  "3": "🎨 สื่อการสอนเทคโนโลยี",
  "4": "📝 แบบทดสอบ/แบบประเมิน"
};

const PROMPTS = [
  // ═══════════════════════════════════════════
  // หมวด 1: วิเคราะห์หลักสูตร / แผนการสอน (22 prompts)
  // ═══════════════════════════════════════════
  {
    id:1, cat:"1",
    title:"วิเคราะห์มาตรฐานและตัวชี้วัด วิชาเทคโนโลยี ม.ปลาย",
    desc:"ถอดรหัสมาตรฐาน วท.1-3 และตัวชี้วัดช่วงชั้น ม.4-6 ให้เข้าใจง่าย",
    role:"คุณคือผู้เชี่ยวชาญด้านหลักสูตรวิทยาศาสตร์เทคโนโลยี สพฐ. มีประสบการณ์วิเคราะห์มาตรฐานการเรียนรู้และตัวชี้วัดตามหลักสูตรแกนกลาง 2551 (ปรับปรุง 2560)",
    input:"มาตรฐานการเรียนรู้และตัวชี้วัด วิชาเทคโนโลยี ม.ปลาย: [ระบุมาตรฐาน/ตัวชี้วัดที่ต้องการวิเคราะห์] ระดับชั้น: [ม.4 / ม.5 / ม.6] บริบทโรงเรียน: [ขนาด/สภาพแวดล้อม]",
    steps:"1. ถอดความหมายมาตรฐานการเรียนรู้เป็นภาษาที่เข้าใจง่าย\n2. แยกย่อยตัวชี้วัดเป็น KSA (Knowledge, Skill, Attitude)\n3. เชื่อมโยงกับสมรรถนะสำคัญของผู้เรียนตามหลักสูตร\n4. ระบุระดับการคิดตาม Bloom's Taxonomy\n5. เสนอแนวทางการจัดการเรียนรู้ที่สอดคล้อง",
    expect:"ตารางวิเคราะห์มาตรฐาน/ตัวชี้วัดพร้อมระดับการคิด Bloom's แนวทางการสอนที่ตรงกับบริบท ม.ปลาย สพฐ. และรายการหลักฐานการเรียนรู้ที่ควรเก็บรวบรวม"
  },
  {
    id:2, cat:"1",
    title:"ออกแบบโครงสร้างรายวิชา (Course Outline) เทคโนโลยี ม.ปลาย",
    desc:"วางโครงสร้างรายวิชาพร้อมน้ำหนักชั่วโมงและหัวข้อที่สอดคล้องหลักสูตร",
    role:"คุณคือหัวหน้ากลุ่มสาระฯ วิชาวิทยาศาสตร์และเทคโนโลยี ผู้เชี่ยวชาญการออกแบบโครงสร้างรายวิชาตามหลักสูตรแกนกลาง สพฐ.",
    input:"รายวิชา: [ชื่อวิชา เช่น เทคโนโลยี (วิทยาการคำนวณ) หรือ เทคโนโลยีสารสนเทศ] ระดับชั้น: [ม.4/5/6] จำนวนชั่วโมง/ปี: [จำนวน] สัดส่วนคะแนน: [กำหนดเอง/มาตรฐาน]",
    steps:"1. กำหนดจุดประสงค์รายวิชาจากมาตรฐานและตัวชี้วัด\n2. วิเคราะห์เนื้อหาสาระและจัดลำดับความยากง่าย\n3. จัดสรรชั่วโมงเรียนแต่ละหน่วย\n4. กำหนดงาน/ชิ้นงานและสัดส่วนการวัดผล\n5. ออกแบบตารางโครงสร้างรายวิชาที่สมบูรณ์",
    expect:"Course Outline สมบูรณ์พร้อมตารางหน่วยการเรียนรู้ ชั่วโมง น้ำหนักคะแนน และชิ้นงาน พร้อม Rationale อธิบายเหตุผลการออกแบบ"
  },
  {
    id:3, cat:"1",
    title:"เขียนแผนการจัดการเรียนรู้ (แผนฯ) หน่วยการเรียนรู้เทคโนโลยี",
    desc:"สร้างแผนการสอนมาตรฐาน สพฐ. ครบ 8 องค์ประกอบสำหรับวิชาเทคโนโลยี",
    role:"คุณคือครูผู้เชี่ยวชาญการเขียนแผนการจัดการเรียนรู้ตามแนวทาง สพฐ. ที่มีประสบการณ์ผ่านการประเมินวิทยฐานะและได้รับรางวัลครูดีเด่น",
    input:"หน่วยการเรียนรู้: [ชื่อหน่วย] เวลาเรียน: [จำนวนชั่วโมง] มาตรฐาน/ตัวชี้วัด: [ระบุ] วิธีการสอน: [Project-Based/Inquiry/STEM/อื่นๆ] สื่อและวัสดุ: [รายการ]",
    steps:"1. เขียนสาระสำคัญและจุดประสงค์การเรียนรู้ (K, P, A)\n2. ออกแบบกิจกรรมการเรียนรู้แบบ Active Learning\n3. กำหนดสื่อ/แหล่งเรียนรู้ที่หลากหลาย\n4. ออกแบบการวัดและประเมินผลตรงตามจุดประสงค์\n5. เขียนบันทึกหลังการสอน (Template)\n6. ตรวจสอบความสอดคล้องทุกองค์ประกอบ",
    expect:"แผนการจัดการเรียนรู้ครบ 8 องค์ประกอบตามมาตรฐาน สพฐ. พร้อมกิจกรรม Active Learning บูรณาการ STEM และแบบบันทึกหลังการสอน"
  },
  {
    id:4, cat:"1",
    title:"ออกแบบหน่วยการเรียนรู้แบบ Backward Design (UbD)",
    desc:"วางแผนหน่วยเรียนรู้โดยเริ่มจากผลลัพธ์ที่ต้องการตามแนวทาง Understanding by Design",

// ─── STATE ───
let currentFilter = 'all';
let currentPrompt = null;

// ─── RENDER ───
function renderCards() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('grid');
  const filtered = PROMPTS.filter(p => {
    const matchCat = currentFilter === 'all' || p.cat === currentFilter;
    const matchSearch = !query || p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
    return matchCat && matchSearch;
  });

  document.getElementById('statsBar').textContent = `แสดง ${filtered.length} / ${PROMPTS.length} prompts`;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">🔍 ไม่พบ prompt ที่ตรงกับการค้นหา</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="card" data-cat="${p.cat}" onclick="openModal(${p.id})">
      <span class="card-num">#${String(p.id).padStart(2,'0')}</span>
      <div class="card-badge">${CAT_NAMES[p.cat]}</div>
      <div class="card-title">${p.title}</div>
      <div class="card-desc">${p.desc}</div>
    </div>
  `).join('');
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCards() { renderCards(); }

// ─── MODAL ───
function openModal(id) {
  const p = PROMPTS.find(x => x.id === id);
  if (!p) return;
  currentPrompt = p;

  const badge = document.getElementById('modalBadge');
  badge.innerHTML = `<span class="card-badge" style="display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;font-weight:700;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:4px;">${CAT_NAMES[p.cat]}</span>`;

  // Set badge bg by cat
  const colors = {'1':'rgba(79,142,247,.15)','2':'rgba(56,201,160,.15)','3':'rgba(244,161,53,.15)','4':'rgba(224,92,122,.15)'};
  const textColors = {'1':'#4f8ef7','2':'#38c9a0','3':'#f4a135','4':'#e05c7a'};
  badge.querySelector('.card-badge').style.background = colors[p.cat];
  badge.querySelector('.card-badge').style.color = textColors[p.cat];

  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalBody').innerHTML = `
    <div class="rise-block">
      <div class="rise-label">R — ROLE : บทบาท AI</div>
      <div class="rise-content">${p.role}</div>
    </div>
    <div class="rise-block">
      <div class="rise-label">I — INPUT : ข้อมูลที่ต้องเตรียม</div>
      <div class="rise-content">${p.input}</div>
    </div>
    <div class="rise-block">
      <div class="rise-label">S — STEPS : ขั้นตอนการทำงาน</div>
      <div class="rise-content">${p.steps}</div>
    </div>
    <div class="rise-block">
      <div class="rise-label">E — EXPECTATION : ผลลัพธ์ที่ต้องการ</div>
      <div class="rise-content">${p.expect}</div>
    </div>
  `;

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.textContent = '📋 คัดลอก Prompt';
  copyBtn.classList.remove('copied');

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if (e.target.id === 'overlay') closeModal();
}

function copyPrompt() {
  if (!currentPrompt) return;
  const p = currentPrompt;
  const text = `**RISE Prompt: ${p.title}**\n\n**R – Role (บทบาท AI)**\n${p.role}\n\n**I – Input (ข้อมูลที่ต้องเตรียม)**\n${p.input}\n\n**S – Steps (ขั้นตอน)**\n${p.steps}\n\n**E – Expectation (ผลลัพธ์)**\n${p.expect}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ คัดลอกแล้ว!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 คัดลอก Prompt';
      btn.classList.remove('copied');
    }, 2000);
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ─── DOWNLOAD ───
function downloadHTML() {
  const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'RISE_PromptLibrary_TeacherTech_90.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─── INIT ───
renderCards();
</script>
